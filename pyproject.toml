[project]
name = "pccompat"
version = "0.1.0"
description = "PCCompat-TG: temporal compatibility graph of desktop PC parts"
readme = "README.md"
authors = [
    { name = "hrihell" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
]

[project.scripts]
pccompat = "pccompat:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "docs", "config"]
